<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Surface Engine — Atomic Design System</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root {
  --bg: #06060b;
  --surface: #0c0c14;
  --surface2: #101018;
  --surface3: #141420;
  --border: #1a1a28;
  --border-light: #252538;
  --text: #e4e4ef;
  --text-dim: #6b6b80;
  --text-muted: #3a3a4f;
  --primitives: #6366f1;
  --inputs: #f43f5e;
  --display: #f59e0b;
  --navigation: #10b981;
  --feedback: #8b5cf6;
  --layout: #06b6d4;
  --overlay: #ec4899;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: grid;
  grid-template-rows: 52px 1fr;
  grid-template-columns: 280px 1fr 300px;
  grid-template-areas:
    "hud hud hud"
    "log main feed";
}

/* === HUD TOP BAR === */
.hud {
  grid-area: hud;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 16px;
  z-index: 100;
}

.hud-brand {
  font-size: 0.65rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 8px;
}

.hud-brand span { color: var(--text); }

/* AI pulse indicator */
.ai-pulse {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--navigation);
  box-shadow: 0 0 8px rgba(16,185,129,0.4);
  animation: ai-breathe 2s ease-in-out infinite;
}

@keyframes ai-breathe {
  0%,100% { opacity:1; transform:scale(1); box-shadow: 0 0 8px rgba(16,185,129,0.4); }
  50% { opacity:0.7; transform:scale(1.3); box-shadow: 0 0 16px rgba(16,185,129,0.6); }
}

.hud-divider { width:1px; height:20px; background:var(--border); }

.hud-stats {
  display: flex;
  gap: 20px;
  flex: 1;
}

.hud-stat {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.6rem;
  color: var(--text-dim);
  letter-spacing: 0.04em;
}

.hud-stat-value {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  color: var(--text);
  font-size: 0.65rem;
}

.hud-controls {
  display: flex;
  gap: 8px;
  align-items: center;
}

.hud-btn {
  padding: 5px 14px;
  border-radius: 8px;
  font-size: 0.6rem;
  font-weight: 600;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.15s;
  font-family: 'Inter', sans-serif;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.hud-btn:hover { border-color: var(--border-light); color: var(--text); }

.hud-btn.active {
  background: rgba(16,185,129,0.1);
  border-color: rgba(16,185,129,0.2);
  color: var(--navigation);
}

.hud-btn.danger {
  background: rgba(244,63,94,0.08);
  border-color: rgba(244,63,94,0.15);
  color: var(--inputs);
}

.speed-control {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.55rem;
  color: var(--text-muted);
}

.speed-btn {
  width: 22px; height: 22px;
  border-radius: 5px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  font-size: 0.6rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  transition: all 0.15s;
}

.speed-btn:hover { border-color: var(--border-light); color: var(--text); }
.speed-btn.active { background: rgba(255,255,255,0.04); color: var(--text); }

/* === AI LOG PANEL === */
.ai-log {
  grid-area: log;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.panel-header {
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.panel-title {
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 8px;
}

.panel-title .title-dot {
  width: 5px; height: 5px; border-radius: 50%;
}

.log-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.log-scroll::-webkit-scrollbar { width: 3px; }
.log-scroll::-webkit-scrollbar-track { background: transparent; }
.log-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Log entry */
.log-entry {
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface2);
  padding: 10px 12px;
  animation: log-slide-in 0.4s cubic-bezier(0.23,1,0.32,1);
  transition: opacity 0.3s;
}

@keyframes log-slide-in {
  from { opacity:0; transform:translateX(-12px); }
  to { opacity:1; transform:translateX(0); }
}

.log-entry.faded { opacity: 0.35; }

.log-entry-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}

.log-element {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 2px 7px;
  border-radius: 5px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem;
  font-weight: 700;
}

.log-element .log-w {
  font-size: 0.45rem;
  opacity: 0.5;
}

.log-surface {
  font-size: 0.5rem;
  padding: 2px 6px;
  border-radius: 4px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 600;
}

.log-time {
  font-size: 0.5rem;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  margin-left: auto;
}

.log-context {
  font-size: 0.62rem;
  color: var(--text-dim);
  line-height: 1.45;
  margin-bottom: 6px;
}

.log-reasoning {
  font-size: 0.55rem;
  color: var(--text-muted);
  font-style: italic;
  padding-left: 8px;
  border-left: 2px solid var(--border);
}

/* === MAIN SURFACE === */
.main-surface {
  grid-area: main;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.main-surface::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.01) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.01) 1px, transparent 1px);
  background-size: 50px 50px;
  pointer-events: none;
  z-index: 0;
}

/* Card surface area */
.card-surface {
  flex: 1;
  padding: 24px;
  overflow-y: auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
  align-content: start;
  position: relative;
  z-index: 1;
}

.card-surface::-webkit-scrollbar { width: 3px; }
.card-surface::-webkit-scrollbar-track { background: transparent; }
.card-surface::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Empty state */
.empty-state {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  color: var(--text-muted);
  text-align: center;
  gap: 12px;
}

.empty-state-icon {
  width: 48px; height: 48px;
  border-radius: 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  margin-bottom: 4px;
}

.empty-state-title { font-size: 0.85rem; font-weight: 600; color: var(--text-dim); }
.empty-state-sub { font-size: 0.7rem; max-width: 280px; line-height: 1.5; }

/* Surface card */
.surface-card {
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--surface2);
  overflow: hidden;
  animation: card-appear 0.5s cubic-bezier(0.23,1,0.32,1);
  position: relative;
}

@keyframes card-appear {
  from { opacity:0; transform:translateY(16px) scale(0.96); }
  to { opacity:1; transform:translateY(0) scale(1); }
}

.surface-card-head {
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
}

.sc-element {
  width: 42px; height: 46px;
  border-radius: 7px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(255,255,255,0.05);
  flex-shrink: 0;
  position: relative;
}

.sc-element .sc-w {
  position: absolute;
  top: 3px;
  left: 5px;
  font-size: 0.4rem;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  opacity: 0.45;
}

.sc-element .sc-sym {
  font-size: 1rem;
  font-weight: 800;
  line-height: 1;
}

.sc-element .sc-name {
  font-size: 0.35rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  opacity: 0.5;
  margin-top: 1px;
}

.sc-info { flex:1; }
.sc-info-title { font-size: 0.78rem; font-weight: 700; color: #ccc; }
.sc-info-sub { font-size: 0.58rem; color: var(--text-muted); margin-top: 2px; }

.surface-card-body {
  padding: 14px;
}

/* Mini component styles */
.m-text { font-size: 0.72rem; color: var(--text-dim); line-height: 1.5; }
.m-row { display:flex; align-items:center; gap:8px; }
.m-badge { padding:2px 7px; border-radius:7px; font-size:0.52rem; font-weight:600; }
.m-progress { height:4px; border-radius:2px; background:rgba(255,255,255,0.04); overflow:hidden; margin-top:4px; }
.m-progress-fill { height:100%; border-radius:2px; }
.m-btn { display:inline-flex; align-items:center; gap:5px; padding:6px 12px; border-radius:7px; font-size:0.65rem; font-weight:600; cursor:default; }
.m-btn-ghost { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); color:#666; padding:6px 12px; border-radius:7px; font-size:0.65rem; }
.m-avatar { width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.5rem; font-weight:700; flex-shrink:0; }
.m-input { padding:7px 10px; border-radius:7px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); font-size:0.65rem; color:var(--text-dim); }
.m-divider { height:1px; background:rgba(255,255,255,0.04); }

/* === TOAST SYSTEM === */
.toast-container {
  position: fixed;
  top: 64px;
  right: 316px;
  z-index: 500;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
  width: 360px;
}

.toast {
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface2);
  backdrop-filter: blur(16px);
  padding: 12px 14px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  pointer-events: auto;
  animation: toast-in 0.4s cubic-bezier(0.23,1,0.32,1);
  box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  position: relative;
  overflow: hidden;
}

.toast.removing {
  animation: toast-out 0.3s ease forwards;
}

@keyframes toast-in {
  from { opacity:0; transform:translateX(30px) scale(0.95); }
  to { opacity:1; transform:translateX(0) scale(1); }
}

@keyframes toast-out {
  to { opacity:0; transform:translateX(30px) scale(0.95); height:0; padding:0; margin:0; border:0; }
}

.toast-element {
  width: 32px; height: 34px;
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  border: 1px solid rgba(255,255,255,0.04);
}

.toast-element .te-sym { font-size: 0.75rem; font-weight: 800; line-height:1; }
.toast-element .te-w { font-size: 0.35rem; font-family:'JetBrains Mono',monospace; font-weight:700; opacity:0.4; }

.toast-body { flex:1; }
.toast-title { font-size: 0.72rem; font-weight: 600; color: #ccc; margin-bottom: 2px; }
.toast-msg { font-size: 0.62rem; color: var(--text-dim); line-height: 1.4; }

.toast-timer {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 2px;
  border-radius: 0 0 0 12px;
  animation: toast-timer-shrink linear forwards;
}

@keyframes toast-timer-shrink {
  from { width: 100%; }
  to { width: 0%; }
}

/* === MODAL OVERLAY === */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 600;
  background: rgba(6,6,11,0.8);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s;
}

.modal-overlay.active { opacity:1; pointer-events:auto; }

.modal-card {
  width: 440px;
  max-width: 90vw;
  border-radius: 18px;
  border: 1px solid var(--border-light);
  background: var(--surface2);
  overflow: hidden;
  transform: scale(0.92) translateY(20px);
  transition: transform 0.4s cubic-bezier(0.23,1,0.32,1);
  position: relative;
}

.modal-overlay.active .modal-card { transform: scale(1) translateY(0); }

.modal-head {
  padding: 20px 22px;
  display: flex;
  align-items: center;
  gap: 14px;
  border-bottom: 1px solid var(--border);
}

.modal-element {
  width: 52px; height: 56px;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  border: 1px solid rgba(255,255,255,0.06);
  position: relative;
}

.modal-element .me-w {
  position: absolute; top:4px; left:6px;
  font-size: 0.45rem; font-family:'JetBrains Mono',monospace; font-weight:700; opacity:0.5;
}

.modal-element .me-sym { font-size:1.2rem; font-weight:800; line-height:1; }
.modal-element .me-name { font-size:0.38rem; text-transform:uppercase; letter-spacing:0.06em; opacity:0.5; margin-top:2px; }

.modal-info h3 { font-size:1rem; font-weight:800; margin-bottom:3px; }
.modal-info .modal-cat { font-size:0.58rem; text-transform:uppercase; letter-spacing:0.08em; }

.modal-close {
  position:absolute; top:14px; right:16px;
  width:28px; height:28px; border-radius:7px;
  border:1px solid var(--border); background:transparent;
  color:var(--text-dim); font-size:1rem; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition: all 0.15s;
}

.modal-close:hover { background:rgba(255,255,255,0.04); color:var(--text); }

.modal-body { padding: 20px 22px; }

.modal-actions {
  padding: 0 22px 20px;
  display: flex;
  gap: 8px;
}

/* === FEED PANEL === */
.feed-panel {
  grid-area: feed;
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.feed-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.feed-scroll::-webkit-scrollbar { width: 3px; }
.feed-scroll::-webkit-scrollbar-track { background: transparent; }
.feed-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.feed-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid transparent;
  animation: feed-in 0.35s cubic-bezier(0.23,1,0.32,1);
  transition: background 0.15s;
}

.feed-item:hover { background: rgba(255,255,255,0.015); border-color: var(--border); }

@keyframes feed-in {
  from { opacity:0; transform:translateY(-8px); }
  to { opacity:1; transform:translateY(0); }
}

.feed-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-top: 4px;
  flex-shrink: 0;
  box-shadow: 0 0 6px;
}

.feed-content { flex: 1; }
.feed-title { font-size: 0.68rem; font-weight: 600; color: #bbb; margin-bottom: 2px; }
.feed-desc { font-size: 0.58rem; color: var(--text-muted); line-height: 1.4; }
.feed-time { font-size: 0.48rem; color: var(--text-muted); font-family:'JetBrains Mono',monospace; margin-top: 3px; }

.feed-element-tag {
  display: flex;
  align-items: center;
  gap: 3px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.5rem;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 4px;
  margin-top: 4px;
  display: inline-flex;
}

/* Ambient corner orbs */
.corner-orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.04;
  pointer-events: none;
  z-index: 0;
}

</style>
</head>
<body>

<div class="corner-orb" style="width:400px;height:400px;background:var(--primitives);top:-100px;left:200px"></div>
<div class="corner-orb" style="width:350px;height:350px;background:var(--overlay);bottom:-50px;right:200px"></div>

<!-- HUD -->
<div class="hud">
  <div class="hud-brand">
    <div class="ai-pulse"></div>
    <span>AI</span> Surface Engine
  </div>
  <div class="hud-divider"></div>
  <div class="hud-stats">
    <div class="hud-stat">Events <span class="hud-stat-value" id="eventCount">0</span></div>
    <div class="hud-stat">Toasts <span class="hud-stat-value" id="toastCount">0</span></div>
    <div class="hud-stat">Cards <span class="hud-stat-value" id="cardCount">0</span></div>
    <div class="hud-stat">Modals <span class="hud-stat-value" id="modalCount">0</span></div>
  </div>
  <div class="hud-controls">
    <div class="speed-control">
      SPD
      <button class="speed-btn" data-speed="3000">1x</button>
      <button class="speed-btn active" data-speed="2000">2x</button>
      <button class="speed-btn" data-speed="1000">4x</button>
    </div>
    <div class="hud-divider"></div>
    <button class="hud-btn active" id="btnAutoplay">&#9654; Auto</button>
    <button class="hud-btn" id="btnNext">Next &#8250;</button>
    <button class="hud-btn danger" id="btnClear">Clear</button>
  </div>
</div>

<!-- AI Log -->
<div class="ai-log">
  <div class="panel-header">
    <div class="panel-title">
      <div class="title-dot" style="background:var(--navigation)"></div>
      AI Decision Log
    </div>
  </div>
  <div class="log-scroll" id="logScroll"></div>
</div>

<!-- Main Surface -->
<div class="main-surface">
  <div class="card-surface" id="cardSurface">
    <div class="empty-state" id="emptyState">
      <div class="empty-state-icon">&#9670;</div>
      <div class="empty-state-title">AI Surface Engine</div>
      <div class="empty-state-sub">The AI agent is analyzing context and will deliver the right components to the right surfaces in real time. Watch the decision log on the left.</div>
    </div>
  </div>
</div>

<!-- Feed Panel -->
<div class="feed-panel">
  <div class="panel-header">
    <div class="panel-title">
      <div class="title-dot" style="background:var(--feedback)"></div>
      Activity Feed
    </div>
  </div>
  <div class="feed-scroll" id="feedScroll"></div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Modal Overlay -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card" id="modalCard"></div>
</div>

<script>
// ============ AI EVENT SCENARIOS ============
const scenarios = [
  {
    context: 'User session started — personalization loaded',
    reasoning: 'Low-priority welcome context → lightweight toast (Ts, weight 3) to greet without interrupting.',
    surface: 'toast',
    symbol: 'Ts', weight: 3, name: 'Toast', cat: 'feedback', color: '#8b5cf6',
    toastTitle: 'Welcome back, Pej',
    toastMsg: 'Your workspace is synced. 3 items need attention.',
    toastDuration: 5000,
    feedTitle: 'Session started',
    feedDesc: 'Workspace loaded with latest sync state'
  },
  {
    context: 'Analytics API returned — revenue anomaly detected (+23%)',
    reasoning: 'Significant data insight → persistent card (Cd, weight 4) with chart context. Warrants visual space in main surface.',
    surface: 'card',
    symbol: 'Cd', weight: 4, name: 'Card', cat: 'layout', color: '#06b6d4',
    cardTitle: 'Revenue Spike Detected',
    cardSub: 'Anomaly detected by analytics engine',
    cardContent: `
      <div class="m-text">Revenue increased <span style="color:#10b981;font-weight:600">+23.4%</span> compared to the trailing 7-day average. Primary driver: Enterprise tier upgrades.</div>
      <div style="display:flex;gap:12px;margin-top:10px">

// ============ ENGINE STATE ============
let eventIndex = 0;
let autoplay = true;
let speed = 2000;
let eventCounter = 0;
let toastCounter = 0;
let cardCounter = 0;
let modalCounter = 0;
let intervalId = null;

// ============ RENDERING ============
function getTimestamp() {
  const now = new Date();
  return now.toLocaleTimeString('en-US', { hour12: false, hour:'2-digit', minute:'2-digit', second:'2-digit' });
}

function addLogEntry(s) {
  const scroll = document.getElementById('logScroll');

  // Fade older entries
  scroll.querySelectorAll('.log-entry').forEach((el, i) => {
    if (i > 5) el.classList.add('faded');
  });

  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML = `
    <div class="log-entry-top">
      <div class="log-element" style="background:${s.color}12;color:${s.color}">
        <span class="log-w">${s.weight}</span>${s.symbol}
      </div>
      <div class="log-surface">${s.surface}</div>
      <div class="log-time">${getTimestamp()}</div>
    </div>
    <div class="log-context">${s.context}</div>
    <div class="log-reasoning">${s.reasoning}</div>
  `;

  scroll.insertBefore(entry, scroll.firstChild);
}

function addFeedItem(s) {
  const scroll = document.getElementById('feedScroll');
  const item = document.createElement('div');
  item.className = 'feed-item';
  item.innerHTML = `
    <div class="feed-dot" style="background:${s.color};box-shadow:0 0 6px ${s.color}40"></div>
    <div class="feed-content">
      <div class="feed-title">${s.feedTitle}</div>
      <div class="feed-desc">${s.feedDesc}</div>
      <div class="feed-element-tag" style="background:${s.color}10;color:${s.color}">${s.weight} ${s.symbol} · ${s.cat}</div>
      <div class="feed-time">${getTimestamp()}</div>
    </div>
  `;
  scroll.insertBefore(item, scroll.firstChild);
}

function showToast(s) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `
    <div class="toast-element" style="background:${s.color}0c;border-color:${s.color}15">
      <span class="te-w" style="color:${s.color}">${s.weight}</span>
      <span class="te-sym" style="color:${s.color}">${s.symbol}</span>
    </div>
    <div class="toast-body">
      <div class="toast-title">${s.toastTitle}</div>
      <div class="toast-msg">${s.toastMsg}</div>
    </div>
    <div class="toast-timer" style="background:${s.color};animation-duration:${s.toastDuration}ms"></div>
  `;
  container.appendChild(toast);
  toastCounter++;
  updateStats();

  setTimeout(() => {
    toast.classList.add('removing');
    setTimeout(() => toast.remove(), 300);
  }, s.toastDuration);
}

function showCard(s) {
  const surface = document.getElementById('cardSurface');
  const empty = document.getElementById('emptyState');
  if (empty) empty.remove();

  const card = document.createElement('div');
  card.className = 'surface-card';
  card.innerHTML = `
    <div class="surface-card-head">
      <div class="sc-element" style="background:${s.color}0a;border-color:${s.color}15">
        <span class="sc-w" style="color:${s.color}">${s.weight}</span>
        <span class="sc-sym" style="color:${s.color}">${s.symbol}</span>
        <span class="sc-name">${s.name}</span>
      </div>
      <div class="sc-info">
        <div class="sc-info-title">${s.cardTitle}</div>
        <div class="sc-info-sub">${s.cardSub}</div>
      </div>
    </div>
    <div class="surface-card-body">${s.cardContent}</div>
  `;
  surface.insertBefore(card, surface.firstChild);
  cardCounter++;
  updateStats();
}

function showModal(s) {
  const card = document.getElementById('modalCard');
  card.innerHTML = `
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div class="modal-head">
      <div class="modal-element" style="background:${s.color}0a;border-color:${s.color}18">
        <span class="me-w" style="color:${s.color}">${s.weight}</span>
        <span class="me-sym" style="color:${s.color}">${s.symbol}</span>
        <span class="me-name">${s.name}</span>
      </div>
      <div class="modal-info">
        <h3 style="color:${s.color}">${s.modalTitle}</h3>
        <div class="modal-cat" style="color:${s.color}88">${s.modalCat}</div>
      </div>
    </div>
    <div class="modal-body">${s.modalContent}</div>
    <div class="modal-actions">${s.modalActions}</div>
  `;
  document.getElementById('modalOverlay').classList.add('active');
  modalCounter++;
  updateStats();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

function updateStats() {
  document.getElementById('eventCount').textContent = eventCounter;
  document.getElementById('toastCount').textContent = toastCounter;
  document.getElementById('cardCount').textContent = cardCounter;
  document.getElementById('modalCount').textContent = modalCounter;
}

// ============ ENGINE ============
function fireNext() {
  const s = scenarios[eventIndex % scenarios.length];
  eventCounter++;
  eventIndex++;

  addLogEntry(s);
  addFeedItem(s);

  if (s.surface === 'toast') showToast(s);
  else if (s.surface === 'card') showCard(s);
  else if (s.surface === 'modal') showModal(s);

  updateStats();
}

function startAutoplay() {
  if (intervalId) clearInterval(intervalId);
  intervalId = setInterval(fireNext, speed);
}

function stopAutoplay() {
  if (intervalId) { clearInterval(intervalId); intervalId = null; }
}

// ============ CONTROLS ============
document.getElementById('btnAutoplay').addEventListener('click', function() {
  autoplay = !autoplay;
  this.classList.toggle('active', autoplay);
  this.innerHTML = autoplay ? '&#9654; Auto' : '&#9646;&#9646; Paused';
  autoplay ? startAutoplay() : stopAutoplay();
});

document.getElementById('btnNext').addEventListener('click', fireNext);

document.getElementById('btnClear').addEventListener('click', () => {
  document.getElementById('logScroll').innerHTML = '';
  document.getElementById('feedScroll').innerHTML = '';
  document.getElementById('cardSurface').innerHTML = `
    <div class="empty-state" id="emptyState">
      <div class="empty-state-icon">&#9670;</div>
      <div class="empty-state-title">Surface Cleared</div>
      <div class="empty-state-sub">AI agent will continue delivering components to this surface.</div>
    </div>
  `;
  document.getElementById('toastContainer').innerHTML = '';
  closeModal();
  eventCounter = 0; toastCounter = 0; cardCounter = 0; modalCounter = 0;
  updateStats();
});

document.querySelectorAll('.speed-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    speed = parseInt(btn.dataset.speed);
    if (autoplay) { stopAutoplay(); startAutoplay(); }
  });
});

document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
  if (e.key === ' ') { e.preventDefault(); document.getElementById('btnAutoplay').click(); }
  if (e.key === 'ArrowRight') fireNext();
});

// ============ START ============
setTimeout(() => { startAutoplay(); }, 800);
</script>
