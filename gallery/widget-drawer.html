<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Widget Drawer — Atomic Design System</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap');

  :root {
    --bg: #06060b;
    --surface: #0c0c14;
    --surface2: #111119;
    --border: #1a1a28;
    --border-light: #252538;
    --text: #e4e4ef;
    --text-dim: #6b6b80;
    --text-muted: #3a3a4f;

    --primitives: #6366f1;
    --inputs: #f43f5e;
    --display: #f59e0b;
    --navigation: #10b981;
    --feedback: #8b5cf6;
    --layout: #06b6d4;
    --overlay: #ec4899;

    --drawer-height: 88vh;
    --drawer-peek: 200px;
    --handle-area: 56px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  /* === WORKSPACE BACKGROUND === */
  .workspace {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
  }

  .workspace::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }

  .ws-title {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: #1e1e30;
    transition: all 0.6s ease;
  }

  .ws-title.dimmed { color: #0e0e18; }

  .ws-sub {
    font-size: 0.75rem;
    color: #1a1a2a;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    transition: all 0.6s ease;
  }

  .ws-sub.dimmed { color: #0a0a12; }

  /* Ambient orbs */
  .ambient-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.08;
    pointer-events: none;
    z-index: 0;
  }
  .ambient-orb:nth-child(1) { width: 500px; height: 500px; background: var(--primitives); top: -150px; left: -100px; }
  .ambient-orb:nth-child(2) { width: 400px; height: 400px; background: var(--overlay); bottom: 100px; right: -80px; }
  .ambient-orb:nth-child(3) { width: 300px; height: 300px; background: var(--navigation); top: 40%; left: 60%; }

  /* === DRAWER === */
  .drawer-container {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 100;
    height: var(--drawer-height);
    transform: translateY(calc(100% - var(--drawer-peek)));
    transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1);
    will-change: transform;
  }

  .drawer-container.open {
    transform: translateY(0);
  }

  .drawer-container.dragging {
    transition: none;
  }

  .drawer {
    width: 100%;
    height: 100%;
    background: var(--surface);
    border-top: 1px solid transparent;
    border-image: linear-gradient(90deg, transparent, #6366f140, #8b5cf640, #ec489940, #f43f5e40, #f59e0b40, #10b98140, #06b6d440, transparent) 1;
    border-radius: 24px 24px 0 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 -20px 80px rgba(0,0,0,0.6), 0 -2px 30px rgba(139,92,246,0.06);
    position: relative;
  }

  /* Iridescent top-edge glow line */
  .drawer::before {
    content: '';
    position: absolute;
    top: 0;
    left: 10%;
    right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, #6366f1, #8b5cf6, #ec4899, #f43f5e, #f59e0b, #10b981, #06b6d4, transparent);
    background-size: 300% 100%;
    animation: iridescent-shift 5s linear infinite;
    opacity: 0.35;
    z-index: 10;
    filter: blur(0.5px);
  }

  .drawer::after {
    content: '';
    position: absolute;
    top: -1px;
    left: 15%;
    right: 15%;
    height: 8px;
    background: linear-gradient(90deg, transparent, #6366f1, #8b5cf6, #ec4899, #f43f5e, #f59e0b, #10b981, #06b6d4, transparent);
    background-size: 300% 100%;
    animation: iridescent-shift 5s linear infinite;
    opacity: 0.08;
    z-index: 9;
    filter: blur(8px);
  }

  /* Handle area */
  .drawer-handle-area {
    flex-shrink: 0;
    height: var(--handle-area);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    position: relative;
  }

  .drawer-handle-area:active { cursor: grabbing; }

  /* Iridescent pulsing handle */
  .drawer-handle {
    width: 64px;
    height: 5px;
    border-radius: 3px;
    position: relative;
    background: linear-gradient(90deg, #6366f1, #8b5cf6, #ec4899, #f43f5e, #f59e0b, #10b981, #06b6d4, #6366f1);
    background-size: 300% 100%;
    animation: iridescent-shift 4s linear infinite, handle-pulse 2.5s ease-in-out infinite;
    transition: width 0.3s, height 0.3s, box-shadow 0.3s;
  }

  .drawer-handle::before {
    content: '';
    position: absolute;
    inset: -6px -10px;
    border-radius: 8px;
    background: linear-gradient(90deg, #6366f1, #8b5cf6, #ec4899, #f43f5e, #f59e0b, #10b981, #06b6d4, #6366f1);
    background-size: 300% 100%;
    animation: iridescent-shift 4s linear infinite;
    filter: blur(12px);
    opacity: 0.35;
    z-index: -1;
    transition: all 0.3s;
  }

  .drawer-handle::after {
    content: '';
    position: absolute;
    inset: -14px -20px;
    border-radius: 12px;
    background: linear-gradient(90deg, #6366f180, #8b5cf680, #ec489980, #f43f5e80, #f59e0b80, #10b98180, #06b6d480, #6366f180);
    background-size: 300% 100%;
    animation: iridescent-shift 4s linear infinite, handle-outer-pulse 2.5s ease-in-out infinite;
    filter: blur(24px);
    opacity: 0;
    z-index: -2;
    transition: opacity 0.3s;
  }

  .drawer-handle-area:hover .drawer-handle {
    width: 88px;
    height: 6px;
    animation: iridescent-shift 2s linear infinite, handle-pulse-strong 1.8s ease-in-out infinite;
  }

  .drawer-handle-area:hover .drawer-handle::before {
    filter: blur(16px);
    opacity: 0.55;
    inset: -8px -14px;
  }

  .drawer-handle-area:hover .drawer-handle::after {
    opacity: 0.2;
  }

  /* Drawer open state — calmer handle */
  .drawer-container.open .drawer-handle {
    animation: iridescent-shift 6s linear infinite;
    opacity: 0.5;
    width: 48px;
    height: 4px;
  }

  .drawer-container.open .drawer-handle::before {
    opacity: 0.1;
  }

  .drawer-container.open .drawer-handle::after {
    opacity: 0;
  }

  .drawer-container.open .drawer-handle-area:hover .drawer-handle {
    opacity: 0.8;
    width: 64px;
    animation: iridescent-shift 3s linear infinite;
  }

  @keyframes iridescent-shift {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  @keyframes handle-pulse {
    0%, 100% {
      box-shadow: 0 0 8px rgba(139,92,246,0.2), 0 0 20px rgba(99,102,241,0.1);
      transform: scaleX(1);
    }
    50% {
      box-shadow: 0 0 14px rgba(236,72,153,0.3), 0 0 32px rgba(139,92,246,0.15);
      transform: scaleX(1.08);
    }
  }

  @keyframes handle-pulse-strong {
    0%, 100% {
      box-shadow: 0 0 12px rgba(139,92,246,0.3), 0 0 28px rgba(99,102,241,0.15);
      transform: scaleX(1);
    }
    50% {
      box-shadow: 0 0 20px rgba(236,72,153,0.45), 0 0 44px rgba(139,92,246,0.2);
      transform: scaleX(1.12);
    }
  }

  @keyframes handle-outer-pulse {
    0%, 100% { opacity: 0; }
    50% { opacity: 0.15; }
  }

  /* Upward arrow hint below handle */
  .drawer-handle-hint {
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.5rem;
    color: var(--text-muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }

  .drawer-handle-area:hover .drawer-handle-hint {
    opacity: 0.5;
  }

  .drawer-container.open .drawer-handle-hint {
    display: none;
  }

  /* Drawer header */
  .drawer-header {
    flex-shrink: 0;
    padding: 0 32px 20px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .drawer-header-left {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .drawer-title {
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .drawer-title-badge {
    font-size: 0.55rem;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(99,102,241,0.1);
    color: var(--primitives);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .drawer-subtitle {
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .drawer-header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .drawer-filter {
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 0.65rem;
    font-weight: 600;
    color: var(--text-dim);
    border: 1px solid var(--border);
    background: transparent;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .drawer-filter:hover {
    border-color: var(--border-light);
    color: var(--text);
  }

  .drawer-filter.active {
    background: rgba(255,255,255,0.04);
    border-color: var(--border-light);
    color: var(--text);
  }

  /* Drawer body — scrollable widget grid */
  .drawer-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 28px 32px;
    scroll-behavior: smooth;
  }

  .drawer-body::-webkit-scrollbar { width: 4px; }
  .drawer-body::-webkit-scrollbar-track { background: transparent; }
  .drawer-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Widget grid */
  .widget-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }

  /* === WIDGET CARD === */
  .widget-card {
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--surface2);
    overflow: hidden;
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1);
    position: relative;
    outline: none;
  }

  .widget-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 16px;
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
    z-index: 0;
  }

  .widget-card:hover {
    border-color: var(--border-light);
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  }

  .widget-card.selected {
    border-color: var(--cat-color, var(--border-light));
    box-shadow: 0 0 0 1px var(--cat-color, transparent), 0 12px 40px rgba(0,0,0,0.4);
    transform: translateY(-4px) scale(1.01);
  }

  .widget-card.selected::before {
    opacity: 1;
    background: radial-gradient(ellipse at top left, var(--cat-glow, rgba(99,102,241,0.06)), transparent 70%);
  }

  .widget-card.dimmed {
    opacity: 0.25;
    transform: scale(0.97);
    pointer-events: none;
  }

  /* Periodic table element tile — top left */
  .element-tile {
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 10;
    width: 62px;
    height: 68px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.06);
    transition: all 0.3s ease;
  }

  .widget-card.selected .element-tile {
    border-color: rgba(255,255,255,0.12);
    transform: scale(1.08);
  }

  .element-tile .el-weight {
    position: absolute;
    top: 4px;
    left: 7px;
    font-size: 0.5rem;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    opacity: 0.5;
  }

  .element-tile .el-symbol {
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .element-tile .el-name {
    font-size: 0.42rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    opacity: 0.6;
    margin-top: 2px;
  }

  .element-tile .el-cat {
    font-size: 0.35rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    opacity: 0.35;
    margin-top: 1px;
  }

  /* Widget content area */
  .widget-body {
    padding: 16px;
    padding-left: 88px;
    min-height: 160px;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  .widget-body.full-width {
    padding-left: 16px;
    padding-top: 90px;
  }

  /* Big watermark symbol */
  .widget-watermark {
    position: absolute;
    bottom: 8px;
    right: 14px;
    font-size: 3rem;
    font-weight: 900;
    opacity: 0.025;
    pointer-events: none;
    z-index: 0;
    line-height: 1;
    letter-spacing: -0.04em;
  }

  /* === MINI COMPONENT STYLES === */
  .m-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.7rem;
    font-weight: 600;
    border: none;
    cursor: default;
  }

  .m-btn-ghost {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: #888;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.7rem;
    font-weight: 500;
  }

  .m-input {
    padding: 9px 12px;
    border-radius: 8px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    font-size: 0.7rem;
    color: var(--text-dim);
    font-family: 'Inter', sans-serif;
  }

  .m-label {
    font-size: 0.58rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
  }

  .m-text { font-size: 0.75rem; color: #6b6b80; line-height: 1.5; }
  .m-title { font-size: 0.85rem; font-weight: 700; color: #ccc; }
  .m-sub { font-size: 0.6rem; color: #444; }
  .m-divider { height: 1px; background: rgba(255,255,255,0.04); }

  .m-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.6rem; font-weight: 700; flex-shrink: 0;
  }

  .m-badge {
    padding: 2px 7px; border-radius: 8px;
    font-size: 0.55rem; font-weight: 600;
  }

  .m-row { display: flex; align-items: center; gap: 8px; }
  .m-col { display: flex; flex-direction: column; gap: 2px; }

  .m-progress {
    height: 5px; border-radius: 3px;
    background: rgba(255,255,255,0.04); overflow: hidden;
  }
  .m-progress-fill { height: 100%; border-radius: 3px; }

  /* === FOCUSED WIDGET OVERLAY === */
  .focus-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(6,6,11,0.85);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }

  .focus-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .focus-card {
    max-width: 580px;
    width: 90vw;
    border-radius: 24px;
    border: 1px solid var(--border-light);
    background: var(--surface2);
    overflow: hidden;
    transform: scale(0.9) translateY(30px);
    transition: all 0.45s cubic-bezier(0.23, 1, 0.32, 1);
    position: relative;
  }

  .focus-overlay.active .focus-card {
    transform: scale(1) translateY(0);
  }

  .focus-card-header {
    padding: 24px 28px;
    display: flex;
    align-items: center;
    gap: 18px;
    border-bottom: 1px solid var(--border);
  }

  .focus-element-tile {
    width: 72px;
    height: 80px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.08);
    position: relative;
  }

  .focus-element-tile .el-weight {
    position: absolute;
    top: 5px;
    left: 8px;
    font-size: 0.55rem;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    opacity: 0.5;
  }

  .focus-element-tile .el-symbol {
    font-size: 1.6rem;
    font-weight: 800;
    line-height: 1;
  }

  .focus-element-tile .el-name {
    font-size: 0.5rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    opacity: 0.6;
    margin-top: 3px;
  }

  .focus-info {
    flex: 1;
  }

  .focus-info h2 {
    font-size: 1.3rem;
    font-weight: 800;
    margin-bottom: 4px;
  }

  .focus-info .focus-cat {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }

  .focus-info .focus-desc {
    font-size: 0.78rem;
    color: var(--text-dim);
    line-height: 1.5;
  }

  .focus-close {
    position: absolute;
    top: 16px;
    right: 20px;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }

  .focus-close:hover {
    background: rgba(255,255,255,0.04);
    color: var(--text);
  }

  .focus-card-body {
    padding: 28px;
    min-height: 200px;
  }

  .focus-meta {
    display: flex;
    gap: 24px;
    padding: 0 28px 20px;
    border-bottom: 1px solid var(--border);
  }

  .focus-meta-item {
    text-align: center;
  }

  .focus-meta-label {
    font-size: 0.5rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 3px;
  }

  .focus-meta-value {
    font-size: 0.85rem;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Composition pills in focus view */
  .focus-composition {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 16px 28px 20px;
  }

  .comp-pill {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 0.65rem;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.015);
  }

  .comp-pill-sym {
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Bottom bar */
  .bottom-hint {
    position: fixed;
    bottom: calc(var(--drawer-peek) + 10px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    display: flex;
    gap: 14px;
    padding: 8px 16px;
    background: rgba(12,12,20,0.7);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 10px;
    font-size: 0.6rem;
    color: #3a3a4f;
    transition: opacity 0.3s, bottom 0.5s cubic-bezier(0.32, 0.72, 0, 1);
  }

  .bottom-hint.hidden { opacity: 0; pointer-events: none; }

  .bh-key {
    padding: 1px 6px;
    border-radius: 3px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.07);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.55rem;
    color: #555;
  }

  .bh-item { display: flex; align-items: center; gap: 5px; }
</style>
</head>
<body>

<div class="ambient-orb"></div>
<div class="ambient-orb"></div>
<div class="ambient-orb"></div>

<div class="workspace">
  <div class="ws-title" id="wsTitle">Atomic Design System</div>
  <div class="ws-sub" id="wsSub">Drag the handle or press &uarr; to expand</div>
</div>

<!-- Drawer -->
<div class="drawer-container" id="drawerContainer">

const catColors = { primitives:'#6366f1', inputs:'#f43f5e', display:'#f59e0b', navigation:'#10b981', feedback:'#8b5cf6', layout:'#06b6d4', overlay:'#ec4899' };

function buildWidgetCard(w, i) {
  const card = document.createElement('div');
  card.className = 'widget-card';
  card.tabIndex = 0;
  card.dataset.index = i;
  card.dataset.cat = w.cat;
  card.style.setProperty('--cat-color', w.color);
  card.style.setProperty('--cat-glow', w.color + '15');

  const bodyClass = w.fullWidth ? 'widget-body full-width' : 'widget-body';

  card.innerHTML = `
    <div class="element-tile" style="background:${w.color}0a;border-color:${w.color}18">
      <span class="el-weight" style="color:${w.color}">${w.weight}</span>
      <span class="el-symbol" style="color:${w.color}">${w.symbol}</span>
      <span class="el-name">${w.name}</span>
      <span class="el-cat">${w.cat}</span>
    </div>
    <div class="${bodyClass}">${w.content}</div>
    <div class="widget-watermark" style="color:${w.color}">${w.symbol}</div>
  `;

  card.addEventListener('click', () => openFocus(i));
  cardElements.push(card);
  return card;
}

// Build grid
widgets.forEach((w, i) => {
  widgetGrid.appendChild(buildWidgetCard(w, i));
});
visibleIndices = widgets.map((_, i) => i);

// ======= DRAWER DRAG =======
let startY = 0;
let startTranslate = 0;
let dragging = false;

function getDrawerTranslateY() {
  const style = window.getComputedStyle(drawerContainer);
  const matrix = new DOMMatrix(style.transform);
  return matrix.m42;
}

drawerHandle.addEventListener('pointerdown', (e) => {
  dragging = true;
  startY = e.clientY;
  startTranslate = getDrawerTranslateY();
  drawerContainer.classList.add('dragging');
  drawerHandle.setPointerCapture(e.pointerId);
});

drawerHandle.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dy = e.clientY - startY;
  const newY = Math.max(0, startTranslate + dy);
  const maxY = drawerContainer.offsetHeight - 64;
  drawerContainer.style.transform = `translateY(${Math.min(newY, maxY)}px)`;
});

drawerHandle.addEventListener('pointerup', (e) => {
  if (!dragging) return;
  dragging = false;
  drawerContainer.classList.remove('dragging');
  const currentY = getDrawerTranslateY();
  const threshold = drawerContainer.offsetHeight * 0.4;
  if (currentY < threshold) {
    openDrawer();
  } else {
    closeDrawer();
  }
  drawerContainer.style.transform = '';
});

// Click to toggle
drawerHandle.addEventListener('click', (e) => {
  if (dragging) return;
  isOpen ? closeDrawer() : openDrawer();
});

function openDrawer() {
  isOpen = true;
  drawerContainer.classList.add('open');
  wsTitle.classList.add('dimmed');
  wsSub.classList.add('dimmed');
  if (selectedIndex === -1 && visibleIndices.length > 0) {
    selectCard(visibleIndices[0]);
  }
}

function closeDrawer() {
  isOpen = false;
  drawerContainer.classList.remove('open');
  wsTitle.classList.remove('dimmed');
  wsSub.classList.remove('dimmed');
}

// ======= KEYBOARD =======
document.addEventListener('keydown', (e) => {
  // Close focus overlay
  if (e.key === 'Escape') {
    if (focusedWidget !== null) { closeFocus(); return; }
    if (isOpen) { closeDrawer(); return; }
  }

  // Open drawer
  if (e.key === 'ArrowUp' && !isOpen) { openDrawer(); return; }

  // Close drawer
  if (e.key === 'ArrowDown' && isOpen && focusedWidget === null) {
    // If at first row, close
    const posInVisible = visibleIndices.indexOf(selectedIndex);
    const cols = getGridCols();
    if (posInVisible < cols) { closeDrawer(); return; }
    // Otherwise move up
  }

  if (!isOpen || focusedWidget !== null) return;

  const cols = getGridCols();
  const posInVisible = visibleIndices.indexOf(selectedIndex);

  if (e.key === 'ArrowRight') {
    e.preventDefault();
    const next = posInVisible < visibleIndices.length - 1 ? posInVisible + 1 : 0;
    selectCard(visibleIndices[next]);
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    const prev = posInVisible > 0 ? posInVisible - 1 : visibleIndices.length - 1;
    selectCard(visibleIndices[prev]);
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    const next = posInVisible + cols;
    if (next < visibleIndices.length) selectCard(visibleIndices[next]);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    const prev = posInVisible - cols;
    if (prev >= 0) selectCard(visibleIndices[prev]);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (selectedIndex >= 0) openFocus(selectedIndex);
  }
});

function getGridCols() {
  const gridStyle = window.getComputedStyle(widgetGrid);
  return gridStyle.gridTemplateColumns.split(' ').length;
}

function selectCard(index) {
  selectedIndex = index;
  cardElements.forEach((c, ci) => {
    if (ci === index) {
      c.classList.add('selected');
      c.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } else {
      c.classList.remove('selected');
    }
  });
}

// ======= FOCUS OVERLAY =======
function openFocus(index) {
  const w = widgets[index];
  focusedWidget = index;

  document.getElementById('focusHeader').innerHTML = `
    <div class="focus-element-tile" style="background:${w.color}0a;border-color:${w.color}20">
      <span class="el-weight" style="color:${w.color}">${w.weight}</span>
      <span class="el-symbol" style="color:${w.color}">${w.symbol}</span>
      <span class="el-name">${w.name}</span>
    </div>
    <div class="focus-info">
      <h2 style="color:${w.color}">${w.name}</h2>
      <div class="focus-cat" style="color:${w.color}88">${w.cat}</div>
      <div class="focus-desc">${w.desc}</div>
    </div>
  `;

  document.getElementById('focusMeta').innerHTML = `
    <div class="focus-meta-item"><div class="focus-meta-label">Weight</div><div class="focus-meta-value" style="color:${w.color}">${w.weight}</div></div>
    <div class="focus-meta-item"><div class="focus-meta-label">Level</div><div class="focus-meta-value">${w.level}</div></div>
    <div class="focus-meta-item"><div class="focus-meta-label">Children</div><div class="focus-meta-value">${w.children}</div></div>
  `;

  document.getElementById('focusComposition').innerHTML = w.composition.map(sym => {
    const found = widgets.find(x => x.symbol === sym);
    const c = found ? found.color : '#555';
    const n = found ? found.name : sym;
    return `<div class="comp-pill"><span class="comp-pill-sym" style="color:${c}">${sym}</span>${n}</div>`;
  }).join('');

  document.getElementById('focusBody').innerHTML = w.content;
  document.getElementById('focusCard').style.borderColor = w.color + '30';

  focusOverlay.classList.add('active');
}

function closeFocus() {
  focusedWidget = null;
  focusOverlay.classList.remove('active');
}

document.getElementById('focusClose').addEventListener('click', closeFocus);
focusOverlay.addEventListener('click', (e) => {
  if (e.target === focusOverlay) closeFocus();
});

// ======= FILTER =======
document.querySelectorAll('.drawer-filter').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.drawer-filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const filter = btn.dataset.filter;

    visibleIndices = [];
    cardElements.forEach((card, i) => {
      if (filter === 'all' || widgets[i].cat === filter) {
        card.classList.remove('dimmed');
        card.style.display = '';
        visibleIndices.push(i);
      } else {
        card.classList.add('dimmed');
        card.style.display = 'none';
      }
    });

    if (visibleIndices.length > 0 && !visibleIndices.includes(selectedIndex)) {
      selectCard(visibleIndices[0]);
    }
  });
});
</script>
