<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Periodic Table of UI Components</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: #1e1e2e;
    --text: #e4e4ef;
    --text-dim: #6b6b80;
    --text-muted: #3a3a4f;

    /* Category colors */
    --primitives: #6366f1;
    --primitives-bg: rgba(99,102,241,0.08);
    --primitives-glow: rgba(99,102,241,0.3);

    --inputs: #f43f5e;
    --inputs-bg: rgba(244,63,94,0.08);
    --inputs-glow: rgba(244,63,94,0.3);

    --display: #f59e0b;
    --display-bg: rgba(245,158,11,0.08);
    --display-glow: rgba(245,158,11,0.3);

    --navigation: #10b981;
    --navigation-bg: rgba(16,185,129,0.08);
    --navigation-glow: rgba(16,185,129,0.3);

    --feedback: #8b5cf6;
    --feedback-bg: rgba(139,92,246,0.08);
    --feedback-glow: rgba(139,92,246,0.3);

    --layout: #06b6d4;
    --layout-bg: rgba(6,182,212,0.08);
    --layout-glow: rgba(6,182,212,0.3);

    --overlay: #ec4899;
    --overlay-bg: rgba(236,72,153,0.08);
    --overlay-glow: rgba(236,72,153,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background grid effect */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1500px;
    margin: 0 auto;
    padding: 40px 30px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 50px;
  }

  .header h1 {
    font-size: 2.8rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #e4e4ef 0%, #6b6b80 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
  }

  .header .subtitle {
    font-size: 1rem;
    color: var(--text-dim);
    font-weight: 400;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  /* Legend */
  .legend {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 45px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.75rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    padding: 6px 12px;
    border-radius: 6px;
    transition: all 0.2s ease;
  }

  .legend-item:hover {
    background: rgba(255,255,255,0.04);
  }

  .legend-item.active {
    background: rgba(255,255,255,0.06);
    color: var(--text);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 2px;
  }

  /* Periodic Table Grid */
  .table-grid {
    display: grid;
    grid-template-columns: repeat(18, 1fr);
    gap: 5px;
    margin-bottom: 50px;
  }

  /* Row labels */
  .row-label {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.65rem;
    color: var(--text-muted);
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* Element Tile */
  .tile {
    position: relative;
    aspect-ratio: 1;
    border-radius: 8px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid transparent;
    overflow: hidden;
  }

  .tile::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 8px;
    opacity: 0;
    transition: opacity 0.25s ease;
  }

  .tile:hover {
    transform: scale(1.15);
    z-index: 10;
    border-color: var(--cat-color);
  }

  .tile:hover::before {
    opacity: 1;
  }

  .tile .weight {
    position: absolute;
    top: 4px;
    left: 6px;
    font-size: 0.55rem;
    font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
    opacity: 0.6;
  }

  .tile .symbol {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 2px;
  }

  .tile .name {
    font-size: 0.5rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    opacity: 0.7;
    text-align: center;
    line-height: 1.2;
  }

  .tile .category-tag {
    position: absolute;
    bottom: 3px;
    font-size: 0.4rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    opacity: 0.4;
  }

  /* Category-specific styles */
  .tile.primitives {
    background: var(--primitives-bg);
    --cat-color: var(--primitives);
  }
  .tile.primitives::before { background: radial-gradient(circle at center, var(--primitives-glow), transparent 70%); }
  .tile.primitives .symbol { color: var(--primitives); }

  .tile.inputs {
    background: var(--inputs-bg);
    --cat-color: var(--inputs);
  }
  .tile.inputs::before { background: radial-gradient(circle at center, var(--inputs-glow), transparent 70%); }
  .tile.inputs .symbol { color: var(--inputs); }

  .tile.display {
    background: var(--display-bg);
    --cat-color: var(--display);
  }
  .tile.display::before { background: radial-gradient(circle at center, var(--display-glow), transparent 70%); }
  .tile.display .symbol { color: var(--display); }

  .tile.navigation {
    background: var(--navigation-bg);
    --cat-color: var(--navigation);
  }
  .tile.navigation::before { background: radial-gradient(circle at center, var(--navigation-glow), transparent 70%); }
  .tile.navigation .symbol { color: var(--navigation); }

  .tile.feedback {
    background: var(--feedback-bg);
    --cat-color: var(--feedback);
  }
  .tile.feedback::before { background: radial-gradient(circle at center, var(--feedback-glow), transparent 70%); }
  .tile.feedback .symbol { color: var(--feedback); }

  .tile.layout {
    background: var(--layout-bg);
    --cat-color: var(--layout);
  }
  .tile.layout::before { background: radial-gradient(circle at center, var(--layout-glow), transparent 70%); }
  .tile.layout .symbol { color: var(--layout); }

  .tile.overlay {
    background: var(--overlay-bg);
    --cat-color: var(--overlay);
  }
  .tile.overlay::before { background: radial-gradient(circle at center, var(--overlay-glow), transparent 70%); }
  .tile.overlay .symbol { color: var(--overlay); }

  /* Empty cell */
  .empty {
    opacity: 0;
    pointer-events: none;
  }

  /* Detail Panel */
  .detail-panel {
    position: fixed;
    bottom: -400px;
    left: 50%;
    transform: translateX(-50%);
    width: 500px;
    max-width: 90vw;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    padding: 30px;
    z-index: 100;
    transition: bottom 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 -10px 50px rgba(0,0,0,0.5);
  }

  .detail-panel.open {
    bottom: 0;
  }

  .detail-panel .close-btn {
    position: absolute;
    top: 12px;
    right: 16px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 1.5rem;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    transition: all 0.15s;
  }
  .detail-panel .close-btn:hover {
    background: rgba(255,255,255,0.05);
    color: var(--text);
  }

  .detail-header {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 20px;
  }

  .detail-tile-preview {
    width: 80px;
    height: 80px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border: 1px solid;
  }

  .detail-tile-preview .symbol {
    font-size: 1.8rem;
    font-weight: 700;
  }

  .detail-tile-preview .weight-badge {
    font-size: 0.6rem;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    opacity: 0.6;
  }

  .detail-info h2 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .detail-info .detail-category {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 10px;
  }

  .detail-info .detail-desc {
    font-size: 0.85rem;
    color: var(--text-dim);
    line-height: 1.5;
  }

  .detail-meta {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  .meta-item {
    text-align: center;
  }

  .meta-item .meta-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .meta-item .meta-value {
    font-size: 0.95rem;
    font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
  }

  .detail-composition {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .detail-composition h3 {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .composition-atoms {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .comp-atom {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 500;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
  }

  .comp-atom .comp-symbol {
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Filter dimming */
  .tile.dimmed {
    opacity: 0.08;
    transform: scale(0.95);
    pointer-events: none;
  }

  /* Weight scale */
  .weight-scale {
    display: flex;
    justify-content: center;
    gap: 3px;
    margin-bottom: 40px;
  }

  .weight-block {
    width: 60px;
    padding: 8px 0;
    text-align: center;
    border-radius: 6px;
    font-size: 0.65rem;
    color: var(--text-dim);
    letter-spacing: 0.05em;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: default;
    transition: all 0.2s;
  }

  .weight-block .wb-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
    display: block;
    margin-bottom: 2px;
  }

  /* Overlay dimmer */
  .overlay-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 99;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .overlay-bg.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* Responsive */
  @media (max-width: 1200px) {
    .table-grid { gap: 3px; }
    .tile .symbol { font-size: 1rem; }
    .tile .name { font-size: 0.4rem; }
    .tile .weight { font-size: 0.45rem; }
  }

  @media (max-width: 900px) {
    .table-grid {
      grid-template-columns: repeat(10, 1fr);
    }
    .header h1 { font-size: 1.8rem; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Periodic Table of UI</h1>
    <div class="subtitle">An Atomic Design System</div>
  </div>

  <!-- Legend -->
  <div class="legend" id="legend">
    <div class="legend-item active" data-filter="all">
      <div class="legend-dot" style="background: var(--text-dim)"></div>
      All
    </div>
    <div class="legend-item" data-filter="primitives">
      <div class="legend-dot" style="background: var(--primitives)"></div>
      Primitives
    </div>
    <div class="legend-item" data-filter="inputs">
      <div class="legend-dot" style="background: var(--inputs)"></div>
      Inputs
    </div>
    <div class="legend-item" data-filter="display">
      <div class="legend-dot" style="background: var(--display)"></div>
      Display
    </div>
    <div class="legend-item" data-filter="navigation">
      <div class="legend-dot" style="background: var(--navigation)"></div>
      Navigation
    </div>
    <div class="legend-item" data-filter="feedback">
      <div class="legend-dot" style="background: var(--feedback)"></div>
      Feedback
    </div>
    <div class="legend-item" data-filter="layout">
      <div class="legend-dot" style="background: var(--layout)"></div>
      Layout
    </div>
    <div class="legend-item" data-filter="overlay">
      <div class="legend-dot" style="background: var(--overlay)"></div>
      Overlay
    </div>
  </div>

  <!-- Weight Scale -->
  <div class="weight-scale">
    <div class="weight-block"><span class="wb-num">1</span>Atom</div>
    <div class="weight-block"><span class="wb-num">2</span>Molecule</div>
    <div class="weight-block"><span class="wb-num">3</span>Compound</div>
    <div class="weight-block"><span class="wb-num">4</span>Complex</div>
    <div class="weight-block"><span class="wb-num">5</span>Organism</div>
    <div class="weight-block"><span class="wb-num">6</span>System</div>
  </div>

  <!-- The Table -->
  <div class="table-grid" id="periodicTable"></div>
</div>

<!-- Overlay background -->
<div class="overlay-bg" id="overlayBg"></div>

<!-- Detail Panel -->
<div class="detail-panel" id="detailPanel">
  <button class="close-btn" id="closeDetail">&times;</button>
  <div class="detail-header">
    <div class="detail-tile-preview" id="detailTile">
      <span class="weight-badge" id="detailWeight"></span>
      <span class="symbol" id="detailSymbol"></span>
    </div>
    <div class="detail-info">
      <h2 id="detailName"></h2>
      <div class="detail-category" id="detailCategory"></div>
      <div class="detail-desc" id="detailDesc"></div>
    </div>
  </div>
  <div class="detail-meta">
    <div class="meta-item">
      <div class="meta-label">Weight</div>
      <div class="meta-value" id="metaWeight"></div>
    </div>
    <div class="meta-item">
      <div class="meta-label">Level</div>
      <div class="meta-value" id="metaLevel"></div>
    </div>
    <div class="meta-item">
      <div class="meta-label">Children</div>
      <div class="meta-value" id="metaChildren"></div>
    </div>
  </div>
  <div class="detail-composition" id="detailComposition">
    <h3>Composition</h3>
    <div class="composition-atoms" id="compositionAtoms"></div>
  </div>
</div>

// Build the grid
const grid = document.getElementById('periodicTable');
const totalRows = 6;
const totalCols = 18;

for (let r = 1; r <= totalRows; r++) {
  for (let c = 1; c <= totalCols; c++) {
    const comp = components.find(x => x.row === r && x.col === c);
    if (comp) {
      const tile = document.createElement('div');
      tile.className = `tile ${comp.cat}`;
      tile.dataset.id = comp.id;
      tile.dataset.cat = comp.cat;
      tile.innerHTML = `
        <span class="weight">${comp.weight}</span>
        <span class="symbol">${comp.symbol}</span>
        <span class="name">${comp.name}</span>
      `;
      tile.addEventListener('click', () => openDetail(comp));
      grid.appendChild(tile);
    } else {
      const empty = document.createElement('div');
      empty.className = 'empty';
      grid.appendChild(empty);
    }
  }
}

// Detail panel logic
const panel = document.getElementById('detailPanel');
const overlayBg = document.getElementById('overlayBg');

function openDetail(comp) {
  const catColor = getComputedStyle(document.documentElement).getPropertyValue(`--${comp.cat}`).trim();

  document.getElementById('detailTile').style.background = `var(--${comp.cat}-bg)`;
  document.getElementById('detailTile').style.borderColor = catColor;
  document.getElementById('detailSymbol').style.color = catColor;
  document.getElementById('detailSymbol').textContent = comp.symbol;
  document.getElementById('detailWeight').textContent = comp.weight;
  document.getElementById('detailName').textContent = comp.name;
  document.getElementById('detailCategory').style.color = catColor;
  document.getElementById('detailCategory').textContent = comp.cat;
  document.getElementById('detailDesc').textContent = comp.desc;
  document.getElementById('metaWeight').textContent = comp.weight;
  document.getElementById('metaLevel').textContent = comp.level;
  document.getElementById('metaChildren').textContent = comp.children;

  const atomsDiv = document.getElementById('compositionAtoms');
  if (comp.composition.length === 0) {
    document.getElementById('detailComposition').style.display = 'none';
  } else {
    document.getElementById('detailComposition').style.display = 'block';
    atomsDiv.innerHTML = comp.composition.map(sym => {
      const found = components.find(c => c.symbol === sym);
      const color = found ? `var(--${found.cat})` : 'var(--text-dim)';
      const name = found ? found.name : sym;
      return `<div class="comp-atom"><span class="comp-symbol" style="color:${color}">${sym}</span>${name}</div>`;
    }).join('');
  }

  panel.classList.add('open');
  overlayBg.classList.add('active');
}

function closeDetail() {
  panel.classList.remove('open');
  overlayBg.classList.remove('active');
}

document.getElementById('closeDetail').addEventListener('click', closeDetail);
overlayBg.addEventListener('click', closeDetail);

// Legend filtering
const legendItems = document.querySelectorAll('.legend-item');
legendItems.forEach(item => {
  item.addEventListener('click', () => {
    const filter = item.dataset.filter;

    legendItems.forEach(li => li.classList.remove('active'));
    item.classList.add('active');

    document.querySelectorAll('.tile').forEach(tile => {
      if (filter === 'all' || tile.dataset.cat === filter) {
        tile.classList.remove('dimmed');
      } else {
        tile.classList.add('dimmed');
      }
    });
  });
});

// Keyboard close
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDetail();
});
</script>
