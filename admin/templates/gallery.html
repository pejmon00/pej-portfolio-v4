<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        document.documentElement.classList.add("has-primary-nav");
      })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gallery — Portfolio</title>

    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/globals.css" />
    <link rel="stylesheet" href="/assets/css/gallery.css" />
    <script src="/assets/js/gallery-carousel.js" defer></script>
    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
  </head>

  <body>
    <!-- Header Include -->
    <div id="header-placeholder">
      <!-- Fallback: inline header for graceful degradation -->
      <nav aria-label="Primary">
        <div class="nav-inner">
          <a class="nav-logo" href="/" aria-label="Home">
            <img src="/assets/icons/PEJ_PORT_LOGO.svg" alt="Pej Vosooghi" />
          </a>
          <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/experience">Experience</a></li>
            <li><a href="/articles">Articles</a></li>
            <li><a href="/gallery">Gallery</a></li>
          </ul>
        </div>
      </nav>
    </div>

    <!-- Page Content -->
    <main role="main">
      <!-- HERO -->
      <header aria-labelledby="hero-title">
        <!-- editable:heroTitle --><h1 id="hero-title">{{heroTitle}}</h1><!-- /editable:heroTitle -->
        <!-- editable:heroSubtitle --><h4>{{heroSubtitle}}</h4><!-- /editable:heroSubtitle -->
        <!-- editable:heroText --><p>{{heroText}}</p><!-- /editable:heroText -->
{{heroImageSlot}}
      </header>

      <!-- Gallery Grid -->
      <section class="gallery-section">
        <div class="gallery-grid">
{{galleryProjects}}
        </div>
      </section>
    </main>

    <!-- Lightbox Overlay -->
    <div class="lightbox" id="lightbox" role="dialog" aria-label="Image viewer" aria-hidden="true">
      <button class="lightbox__close" aria-label="Close">&times;</button>
      <div class="lightbox__content">
        <button class="lightbox__btn lightbox__btn--prev" aria-label="Previous image">
          <svg width="28" height="28" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M13 4l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="lightbox__image-wrap">
          <img class="lightbox__img" src="" alt="" />
        </div>
        <button class="lightbox__btn lightbox__btn--next" aria-label="Next image">
          <svg width="28" height="28" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7 4l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="lightbox__caption"></div>
      <div class="lightbox__counter"></div>
    </div>

    <!-- Footer Include -->
    <div id="footer-placeholder">
      <!-- Fallback: inline footer for graceful degradation -->
      <footer aria-label="Site footer">
        <div class="footer-inner">
          <div class="footer-links" aria-label="Contact links">
            <a href="mailto:pejmon00@gmail.com" aria-label="Email">
              <img src="/assets/icons/SendFill.svg" alt="" />
            </a>
            <a href="https://www.linkedin.com/in/pejvosooghi/" aria-label="LinkedIn">
              <img src="/assets/icons/Linkedin.svg" alt="" />
            </a>
          </div>
          <div class="footer-copy">&copy; 2026 - 2027 pej.me All Rights Reserved</div>
        </div>
      </footer>
    </div>

    <script src="/_includes.js" defer></script>
  </body>
</html>
