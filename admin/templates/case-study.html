<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        var p = location.pathname;
        document.documentElement.classList.add("has-primary-nav");
        if (/^\/(experience|articles|writing)(\/|$)/.test(p))
          document.documentElement.classList.add("has-secondary-nav");
      })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{pageTitle}} — Portfolio</title>

    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/globals.css" />
    <link rel="stylesheet" href="/assets/css/secondaryNavMobile.css" />
    <script src="/assets/js/secondaryNavMobile.js" defer></script>
    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
  </head>

  <body>
    <!-- Header Include -->
    <div id="header-placeholder">
      <!-- Fallback: inline header for graceful degradation -->
      <nav aria-label="Primary">
        <div class="nav-inner">
          <a class="nav-logo" href="/" aria-label="Home">
            <img src="/assets/icons/PEJ_PORT_LOGO.svg" alt="Pej Vosooghi" />
          </a>
          <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/experience">Experience</a></li>
            <li><a href="/articles">Articles</a></li>
            <li><a href="/gallery">Gallery</a></li>
          </ul>
        </div>
      </nav>
    </div>

    <!-- Secondary Navigation: Experience (siblings-only) -->
    <nav aria-label="Experience" data-secondary-nav>
      <ul>
        <li><a href="/experience">Overview</a></li>
{{secondaryNav}}
      </ul>
    </nav>

    <!-- Long-Form Template (shared across all case studies + articles) -->
    <main role="main">
      <header>
        <h1>{{title}}</h1>
        <p>{{subtitle}}</p>
      </header>

      <!-- Governed Hero Media Slot -->
      <section aria-label="Hero image">
        <div aria-label="Hero image">
{{heroMedia}}
        </div>
      </section>

{{sections}}
{{nextStudyNav}}
    </main>

    <!-- Footer Include -->
    <div id="footer-placeholder">
      <!-- Fallback: inline footer for graceful degradation -->
      <footer aria-label="Site footer">
        <div class="footer-inner">
          <!-- Email + Social Icons (left) -->
          <div class="footer-links" aria-label="Contact links">
            <a href="mailto:pejmon00@gmail.com" aria-label="Email">
              <img src="/assets/icons/SendFill.svg" alt="" />
            </a>
            <a
              href="https://www.linkedin.com/in/pejvosooghi/"
              aria-label="LinkedIn"
            >
              <img src="/assets/icons/Linkedin.svg" alt="" />
            </a>
          </div>

          <!-- Copyright (right) -->
          <div class="footer-copy">&copy; 2026 - 2027 pej.me All Rights Reserved</div>
        </div>
      </footer>
    </div>

    <!-- Client-side includes script -->
    <script src="/_includes.js" defer></script>
  </body>
</html>
